<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atton Raon</title>
<meta name="description" content="Official site — video and upcoming shows.">

<!-- ============================================================
     QUICK-EDIT GUIDE (no coding needed beyond this):
     1. Replace "Atton Raon" everywhere with your act's name.
     2. Swap the VIMEO_ID below for your video (search "VIMEO_ID" in this file)
        — this is now the full-page background, not a section.
     3. Update the Vimeo / Bandcamp links near the bottom.
     4. Upcoming shows are NOT edited here — see README.md, they come
        live from a Google Sheet your client can edit directly.
     ============================================================ -->

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- BACKGROUND: photo shows immediately, video fades in on top once it's
     loaded. Purely decorative, hidden from screen readers. -->
<div class="bg-media" aria-hidden="true">
  <div class="bg-image"></div>
  <div class="bg-video-frame">
    <!-- Replace VIMEO_ID with your Vimeo video ID (the number in the video's URL) -->
    <iframe
      id="bg-video"
      src="https://player.vimeo.com/video/VIMEO_ID?background=1"
      title=""
      allow="autoplay; fullscreen; picture-in-picture">
    </iframe>
  </div>
  <div class="bg-scrim"></div>
</div>

<header>
  <span class="logo">ATTON RAON</span>
</header>

<main>

  <!-- HERO -->
  <section class="hero">
    <h1>ATTON RAON</h1>
    <p class="tagline">Short one-line description of the act / project goes here.</p>
  </section>

  <!-- ABOUT / TEXT -->
  <section>
    <h2>About</h2>
    <p>
      Put your bio / project description here. Keep it a short paragraph or
      two — this is a landing page, not a full site.
    </p>
  </section>

  <!-- UPCOMING SHOWS (loaded live from a Google Sheet, see README.md) -->
  <section id="shows">
    <h2>Shows</h2>
    <ul id="shows-list" class="shows-list">
      <li class="shows-status">Loading shows…</li>
    </ul>
  </section>

  <!-- LINKS -->
  <section id="links">
    <h2>Links</h2>
    <ul class="links-list">
      <li><a href="#" target="_blank" rel="noopener">Vimeo</a></li>
      <li><a href="#" target="_blank" rel="noopener">Bandcamp</a></li>
    </ul>
  </section>

</main>

<footer>
  <p>&copy; <span id="year"></span> Atton Raon.</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
